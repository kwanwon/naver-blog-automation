name: 🔧 빠른 문제 진단

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  diagnose:
    name: 🔍 문제 진단
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 📋 파일 구조 확인
      run: |
        echo "=== 현재 디렉토리 ==="
        pwd
        echo ""
        echo "=== 루트 파일들 ==="
        ls -la
        echo ""
        echo "=== 필수 파일 확인 ==="
        if [ -f "blog_writer_app.py" ]; then
          echo "✅ blog_writer_app.py 존재 ($(wc -l < blog_writer_app.py) 줄)"
        else
          echo "❌ blog_writer_app.py 없음"
        fi
        
        if [ -f "requirements.txt" ]; then
          echo "✅ requirements.txt 존재"
          echo "내용:"
          cat requirements.txt
        else
          echo "❌ requirements.txt 없음"
        fi
        
        if [ -f "version.json" ]; then
          echo "✅ version.json 존재"
          cat version.json
        else
          echo "❌ version.json 없음"
        fi
        
        if [ -d "config" ]; then
          echo "✅ config 디렉토리 존재"
          ls -la config/ | head -10
        else
          echo "❌ config 디렉토리 없음"
        fi
        
        if [ -d "modules" ]; then
          echo "✅ modules 디렉토리 존재"
          ls -la modules/
        else
          echo "❌ modules 디렉토리 없음"
        fi
        
        echo ""
        echo "=== 이미지 디렉토리 ==="
        ls -d default_images* 2>/dev/null || echo "❌ default_images 디렉토리들 없음"
        
    - name: 🐍 Python 환경 테스트
      run: |
        echo "=== Python 정보 ==="
        python --version
        pip --version
        echo ""
        echo "=== pip 업그레이드 ==="
        python -m pip install --upgrade pip
        echo ""
        echo "=== 기본 패키지 설치 테스트 ==="
        pip install pyinstaller
        pyinstaller --version
        
    - name: 🔨 PyInstaller 기본 테스트
      run: |
        if [ -f "blog_writer_app.py" ]; then
          echo "=== PyInstaller 기본 테스트 ==="
          pyinstaller --onedir --name="테스트빌드" blog_writer_app.py
          echo ""
          echo "=== 빌드 결과 ==="
          if [ -d "dist" ]; then
            echo "✅ dist 디렉토리 생성됨"
            ls -la dist/
          else
            echo "❌ dist 디렉토리 생성 실패"
          fi
        else
          echo "❌ blog_writer_app.py가 없어서 PyInstaller 테스트 불가"
        fi
