name: 🚀 크로스 플랫폼 자동 빌드

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    name: 🪟 Windows 빌드
    runs-on: windows-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        pip install requests  # ChromeManager를 위한 명시적 설치
        pip install Pillow   # PIL (Pillow) 명시적 설치
        pip install selenium # selenium 명시적 설치
        pip install openai   # openai 명시적 설치
        
    - name: 🔨 Windows 빌드
      run: |
        pyinstaller --onedir --windowed --name="블로그자동화" ^
          --add-data "config;config" ^
          --add-data "modules;modules" ^
          --add-data "default_images;default_images" ^
          --add-data "default_images_1;default_images_1" ^
          --add-data "default_images_2;default_images_2" ^
          --add-data "default_images_3;default_images_3" ^
          --add-data "default_images_4;default_images_4" ^
          --add-data "default_images_5;default_images_5" ^
          --add-data "default_images_6;default_images_6" ^
          --add-data "default_images_7;default_images_7" ^
          --add-data "default_images_8;default_images_8" ^
          --add-data "default_images_9;default_images_9" ^
          --add-data "default_images_10;default_images_10" ^
          --add-data "requirements.txt;." ^
          --add-data "version.json;." ^
          blog_writer_app.py
          
    - name: 📁 빌드 결과 확인
      run: dir dist
      
    - name: 📤 Windows 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Windows
        path: dist/블로그자동화/
        retention-days: 30

  build-macos:
    name: 🍎 macOS 빌드
    runs-on: macos-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        pip install requests  # ChromeManager를 위한 명시적 설치
        pip install Pillow   # PIL (Pillow) 명시적 설치
        pip install selenium # selenium 명시적 설치
        pip install openai   # openai 명시적 설치
        
    - name: 🔨 macOS 빌드
      run: |
        pyinstaller --onedir --windowed --name="블로그자동화" \
          --add-data "config:config" \
          --add-data "modules:modules" \
          --add-data "default_images:default_images" \
          --add-data "default_images_1:default_images_1" \
          --add-data "default_images_2:default_images_2" \
          --add-data "default_images_3:default_images_3" \
          --add-data "default_images_4:default_images_4" \
          --add-data "default_images_5:default_images_5" \
          --add-data "default_images_6:default_images_6" \
          --add-data "default_images_7:default_images_7" \
          --add-data "default_images_8:default_images_8" \
          --add-data "default_images_9:default_images_9" \
          --add-data "default_images_10:default_images_10" \
          --add-data "requirements.txt:." \
          --add-data "version.json:." \
          blog_writer_app.py
          
    - name: 📁 빌드 결과 확인
      run: ls -la dist/
      
    - name: 📤 macOS 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-macOS
        path: dist/블로그자동화.app/
        retention-days: 30

  build-linux:
    name: 🐧 Linux 빌드
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        pip install requests  # ChromeManager를 위한 명시적 설치
        pip install Pillow   # PIL (Pillow) 명시적 설치
        pip install selenium # selenium 명시적 설치
        pip install openai   # openai 명시적 설치
        
    - name: 🔨 Linux 빌드
      run: |
        pyinstaller --onedir --windowed --name="블로그자동화" \
          --add-data "config:config" \
          --add-data "modules:modules" \
          --add-data "default_images:default_images" \
          --add-data "default_images_1:default_images_1" \
          --add-data "default_images_2:default_images_2" \
          --add-data "default_images_3:default_images_3" \
          --add-data "default_images_4:default_images_4" \
          --add-data "default_images_5:default_images_5" \
          --add-data "default_images_6:default_images_6" \
          --add-data "default_images_7:default_images_7" \
          --add-data "default_images_8:default_images_8" \
          --add-data "default_images_9:default_images_9" \
          --add-data "default_images_10:default_images_10" \
          --add-data "requirements.txt:." \
          --add-data "version.json:." \
          blog_writer_app.py
          
    - name: 📁 빌드 결과 확인
      run: ls -la dist/
      
    - name: 📤 Linux 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Linux
        path: dist/블로그자동화/
        retention-days: 30

  create-release:
    name: 🎉 릴리스 생성
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: 📥 Windows 빌드 다운로드
      uses: actions/download-artifact@v3
      with:
        name: 블로그자동화-Windows
        path: ./windows-build/
        
    - name: 📥 macOS 빌드 다운로드
      uses: actions/download-artifact@v3
      with:
        name: 블로그자동화-macOS
        path: ./macos-build/
        
    - name: 📥 Linux 빌드 다운로드
      uses: actions/download-artifact@v3
      with:
        name: 블로그자동화-Linux
        path: ./linux-build/
        
    - name: 📦 압축 파일 생성
      run: |
        cd windows-build && zip -r ../블로그자동화-Windows.zip . && cd ..
        cd macos-build && zip -r ../블로그자동화-macOS.zip . && cd ..
        cd linux-build && zip -r ../블로그자동화-Linux.zip . && cd ..
        
    - name: 🎉 GitHub 릴리스 생성
      uses: softprops/action-gh-release@v1
      with:
        files: |
          블로그자동화-Windows.zip
          블로그자동화-macOS.zip
          블로그자동화-Linux.zip
        body: |
          ## 🎉 블로그 자동화 프로그램 새 버전 출시!
          
          ### ✨ 주요 변경사항
          - GPT API 키 업데이트 지원
          - 자동 업데이트 시스템 개선
          - 크로스 플랫폼 빌드 자동화
          
          ### 📥 다운로드
          - **Windows 사용자**: `블로그자동화-Windows.zip` 다운로드
          - **macOS 사용자**: `블로그자동화-macOS.zip` 다운로드
          - **Linux 사용자**: `블로그자동화-Linux.zip` 다운로드
          
          ### 🔧 설치 방법
          1. 압축 파일 다운로드 및 압축 해제
          2. 실행 파일 실행
          3. OpenAI API 키 설정
          
          ---
          **자동 빌드**: GitHub Actions로 생성됨 🤖
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}