name: Auto Version Update

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.json'
      - '.github/workflows/auto-version.yml'
      - 'README.md'
      - '*.md'

jobs:
  auto-version:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip-version]') }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install semver
      run: npm install -g semver

    - name: Get current version
      id: current_version
      run: |
        if [ -f "version.json" ]; then
          CURRENT_VERSION=$(jq -r '.version' version.json)
        else
          CURRENT_VERSION="1.1.0"
        fi
        echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $CURRENT_VERSION"

    - name: Determine version bump type
      id: version_bump
      run: |
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        echo "Commit message: $COMMIT_MSG"
        
        if [[ "$COMMIT_MSG" == *"[MAJOR]"* ]]; then
          echo "bump=major" >> $GITHUB_OUTPUT
          echo "Version bump: MAJOR"
        elif [[ "$COMMIT_MSG" == *"[MINOR]"* ]]; then
          echo "bump=minor" >> $GITHUB_OUTPUT
          echo "Version bump: MINOR"
        else
          echo "bump=patch" >> $GITHUB_OUTPUT
          echo "Version bump: PATCH"
        fi

    - name: Calculate new version
      id: new_version
      run: |
        CURRENT="${{ steps.current_version.outputs.version }}"
        BUMP="${{ steps.version_bump.outputs.bump }}"
        NEW_VERSION=$(npx semver -i $BUMP $CURRENT)
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"

    - name: Extract commit info
      id: commit_info
      run: |
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        COMMIT_AUTHOR="${{ github.event.head_commit.author.name }}"
        COMMIT_DATE=$(date -u +"%Y-%m-%d")
        
        # 커밋 메시지에서 이모지와 태그 제거하여 깔끔한 changelog 생성
        CLEAN_MSG=$(echo "$COMMIT_MSG" | sed 's/\[MAJOR\]//g' | sed 's/\[MINOR\]//g' | sed 's/\[PATCH\]//g' | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')
        
        echo "message=$CLEAN_MSG" >> $GITHUB_OUTPUT
        echo "author=$COMMIT_AUTHOR" >> $GITHUB_OUTPUT
        echo "date=$COMMIT_DATE" >> $GITHUB_OUTPUT

    - name: Basic quality checks
      run: |
        echo "🔍 기본 품질 검사 실행..."
        
        # Python 구문 검사
        echo "1/4 Python 구문 검사..."
        python3 -m py_compile blog_writer_app.py || echo "⚠️ 메인 파일 구문 오류"
        find modules -name "*.py" -exec python3 -m py_compile {} \; 2>/dev/null || echo "⚠️ 모듈 구문 오류"
        
        # 필수 파일 존재 확인
        echo "2/4 필수 파일 확인..."
        REQUIRED_FILES=("blog_writer_app.py" "modules/gpt_handler.py" "modules/serial_auth.py" "modules/auto_updater.py" "config/gpt_settings.txt")
        for file in "${REQUIRED_FILES[@]}"; do
          if [ ! -f "$file" ]; then
            echo "❌ 필수 파일 누락: $file"
            exit 1
          fi
        done
        
        # JSON 파일 유효성 검사
        echo "3/4 JSON 파일 검사..."
        if [ -f "version.json" ]; then
          jq . version.json > /dev/null || (echo "❌ version.json 형식 오류" && exit 1)
        fi
        
        if [ -f "config/gpt_settings.txt" ]; then
          jq . config/gpt_settings.txt > /dev/null || echo "⚠️ gpt_settings.txt 형식 주의"
        fi
        
        # 기본 보안 검사
        echo "4/4 기본 보안 검사..."
        if grep -r "sk-[a-zA-Z0-9]" . --exclude-dir=.git --exclude="*.md" 2>/dev/null; then
          echo "⚠️ API 키가 코드에 하드코딩되어 있을 수 있습니다"
        fi
        
        echo "✅ 기본 품질 검사 완료"

    - name: Update version.json
      run: |
        NEW_VERSION="${{ steps.new_version.outputs.version }}"
        COMMIT_MSG="${{ steps.commit_info.outputs.message }}"
        COMMIT_DATE="${{ steps.commit_info.outputs.date }}"
        
        # 기존 version.json 읽기 (없으면 기본값 사용)
        if [ -f "version.json" ]; then
          EXISTING_CHANGELOG=$(jq -r '.changelog // []' version.json)
        else
          EXISTING_CHANGELOG="[]"
        fi
        
        # 새로운 version.json 생성
        cat > version.json << EOF
        {
          "version": "$NEW_VERSION",
          "release_date": "$COMMIT_DATE",
          "changelog": [
            "$COMMIT_MSG",
            "🔄 자동 버전 업데이트: v$NEW_VERSION",
            "✨ 최신 기능 및 개선사항 포함",
            "🔒 모든 설정 및 시리얼 정보 보존"
          ],
          "min_requirements": {
            "python": "3.7+",
            "os": ["Windows", "macOS", "Linux"]
          },
          "preserved_files": [
            "modules/serial_config.json",
            "naver_cookies.pkl",
            "naver_session.json",
            "user_data.json",
            "config.json",
            "settings.json"
          ],
          "auto_updated": true,
          "commit_sha": "${{ github.sha }}",
          "commit_author": "${{ steps.commit_info.outputs.author }}",
          "quality_checked": true,
          "build_timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
        }
        EOF

    - name: Commit version update
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add version.json
        git commit -m "🔄 자동 버전 업데이트: v${{ steps.new_version.outputs.version }} [skip-version]" || exit 0
        git push

    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.new_version.outputs.version }}
        release_name: "자동 릴리스 v${{ steps.new_version.outputs.version }}"
        body: |
          ## 🚀 자동 업데이트 v${{ steps.new_version.outputs.version }}
          
          ### 📋 변경사항
          - ${{ steps.commit_info.outputs.message }}
          
          ### 📅 릴리스 정보
          - **버전**: v${{ steps.new_version.outputs.version }}
          - **날짜**: ${{ steps.commit_info.outputs.date }}
          - **커밋**: ${{ github.sha }}
          - **작성자**: ${{ steps.commit_info.outputs.author }}
          
          ### 📦 설치 방법
          1. 기존 프로그램을 실행하면 자동으로 업데이트 알림이 표시됩니다
          2. "지금 업데이트" 버튼을 클릭하여 최신 버전으로 업데이트하세요
          3. 모든 설정과 데이터는 자동으로 보존됩니다
          
          ### ⚠️ 주의사항
          - 업데이트 중에는 프로그램을 종료하지 마세요
          - 네트워크 연결이 안정적인 환경에서 업데이트하세요
          - 문제 발생 시 자동으로 이전 버전으로 롤백됩니다
        draft: false
        prerelease: false

    - name: Update summary
      run: |
        echo "## 🎉 자동 버전 업데이트 완료!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **이전 버전**: v${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **새 버전**: v${{ steps.new_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **변경 유형**: ${{ steps.version_bump.outputs.bump }}" >> $GITHUB_STEP_SUMMARY
        echo "- **커밋 메시지**: ${{ steps.commit_info.outputs.message }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "사용자들은 다음 프로그램 실행 시 자동으로 업데이트 알림을 받게 됩니다! 🚀" >> $GITHUB_STEP_SUMMARY
