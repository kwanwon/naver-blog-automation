name: 🎉 성공적인 크로스 플랫폼 빌드

on:
  workflow_dispatch:  # 수동 실행
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/debug-*.yml'

jobs:
  build-windows:
    name: 🪟 Windows 빌드
    runs-on: windows-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 🔨 Windows 빌드
      run: |
        echo "=== 1단계: 기본 빌드 ==="
        pyinstaller --onedir --windowed --name="블로그자동화" blog_writer_app.py
        
        echo "=== 2단계: 필수 파일 복사 ==="
        xcopy /E /I /Y config "dist\블로그자동화\config\"
        xcopy /E /I /Y modules "dist\블로그자동화\modules\"
        copy /Y version.json "dist\블로그자동화\"
        copy /Y requirements.txt "dist\블로그자동화\"
        
        echo "=== 3단계: 이미지 폴더 복사 ==="
        xcopy /E /I /Y default_images "dist\블로그자동화\default_images\"
        xcopy /E /I /Y default_images_1 "dist\블로그자동화\default_images_1\"
        xcopy /E /I /Y default_images_2 "dist\블로그자동화\default_images_2\"
        xcopy /E /I /Y default_images_3 "dist\블로그자동화\default_images_3\"
        xcopy /E /I /Y default_images_4 "dist\블로그자동화\default_images_4\"
        xcopy /E /I /Y default_images_5 "dist\블로그자동화\default_images_5\"
        xcopy /E /I /Y default_images_6 "dist\블로그자동화\default_images_6\"
        xcopy /E /I /Y default_images_7 "dist\블로그자동화\default_images_7\"
        xcopy /E /I /Y default_images_8 "dist\블로그자동화\default_images_8\"
        xcopy /E /I /Y default_images_9 "dist\블로그자동화\default_images_9\"
        xcopy /E /I /Y default_images_10 "dist\블로그자동화\default_images_10\"
        
        echo "=== 빌드 완료 ==="
        dir "dist\블로그자동화"
          
    - name: 📤 Windows 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Windows
        path: dist/블로그자동화/
        retention-days: 30

  build-macos:
    name: 🍎 macOS 빌드
    runs-on: macos-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 🔨 macOS 빌드
      run: |
        echo "=== 1단계: 기본 빌드 ==="
        pyinstaller --onedir --windowed --name="블로그자동화" blog_writer_app.py
        
        echo "=== 2단계: 필수 파일 복사 ==="
        cp -R config "dist/블로그자동화.app/Contents/MacOS/"
        cp -R modules "dist/블로그자동화.app/Contents/MacOS/"
        cp version.json "dist/블로그자동화.app/Contents/MacOS/"
        cp requirements.txt "dist/블로그자동화.app/Contents/MacOS/"
        
        echo "=== 3단계: 이미지 폴더 복사 ==="
        cp -R default_images "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_1 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_2 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_3 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_4 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_5 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_6 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_7 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_8 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_9 "dist/블로그자동화.app/Contents/MacOS/"
        cp -R default_images_10 "dist/블로그자동화.app/Contents/MacOS/"
        
        echo "=== 빌드 완료 ==="
        ls -la "dist/블로그자동화.app/Contents/MacOS/"
          
    - name: 📤 macOS 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-macOS
        path: dist/블로그자동화.app/
        retention-days: 30

  build-linux:
    name: 🐧 Linux 빌드
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 🔨 Linux 빌드
      run: |
        echo "=== 1단계: 기본 빌드 ==="
        pyinstaller --onedir --name="블로그자동화" blog_writer_app.py
        
        echo "=== 2단계: 필수 파일 복사 ==="
        cp -R config "dist/블로그자동화/"
        cp -R modules "dist/블로그자동화/"
        cp version.json "dist/블로그자동화/"
        cp requirements.txt "dist/블로그자동화/"
        
        echo "=== 3단계: 이미지 폴더 복사 ==="
        cp -R default_images "dist/블로그자동화/"
        cp -R default_images_1 "dist/블로그자동화/"
        cp -R default_images_2 "dist/블로그자동화/"
        cp -R default_images_3 "dist/블로그자동화/"
        cp -R default_images_4 "dist/블로그자동화/"
        cp -R default_images_5 "dist/블로그자동화/"
        cp -R default_images_6 "dist/블로그자동화/"
        cp -R default_images_7 "dist/블로그자동화/"
        cp -R default_images_8 "dist/블로그자동화/"
        cp -R default_images_9 "dist/블로그자동화/"
        cp -R default_images_10 "dist/블로그자동화/"
        
        echo "=== 빌드 완료 ==="
        ls -la "dist/블로그자동화/"
          
    - name: 📤 Linux 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Linux
        path: dist/블로그자동화/
        retention-days: 30

  create-release:
    name: 🚀 릴리즈 생성
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 📋 버전 정보 읽기
      id: version
      run: |
        VERSION=$(cat version.json | grep -o '"version": "[^"]*' | grep -o '[^"]*$')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION" >> $GITHUB_OUTPUT
        
    - name: 📦 Windows 아티팩트 다운로드
      uses: actions/download-artifact@v3
      with:
        name: 블로그자동화-Windows
        path: ./artifacts/windows/
        
    - name: 📦 macOS 아티팩트 다운로드
      uses: actions/download-artifact@v3
      with:
        name: 블로그자동화-macOS
        path: ./artifacts/macos/
        
    - name: 📦 Linux 아티팩트 다운로드
      uses: actions/download-artifact@v3
      with:
        name: 블로그자동화-Linux
        path: ./artifacts/linux/
        
    - name: 🗜️ 압축 파일 생성
      run: |
        cd artifacts
        zip -r ../블로그자동화-Windows.zip windows/
        zip -r ../블로그자동화-macOS.zip macos/
        zip -r ../블로그자동화-Linux.zip linux/
        
    - name: 🏷️ 릴리즈 생성
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: 블로그자동화 ${{ steps.version.outputs.version }}
        body: |
          ## 🎉 블로그자동화 ${{ steps.version.outputs.version }} 릴리즈
          
          ### 📥 다운로드
          - **Windows**: 블로그자동화-Windows.zip
          - **macOS**: 블로그자동화-macOS.zip  
          - **Linux**: 블로그자동화-Linux.zip
          
          ### 🚀 주요 기능
          - GPT를 활용한 블로그 콘텐츠 자동 생성
          - 네이버 블로그 자동 포스팅
          - 이미지 자동 삽입 및 관리
          - 크로스 플랫폼 지원
          
          ### 💻 설치 방법
          1. 해당 OS용 zip 파일을 다운로드하세요
          2. 압축을 해제하고 실행 파일을 실행하세요
          3. 첫 실행 시 GPT API 키를 설정하세요
          
          자세한 사용법은 [README](https://github.com/kwanwon/naver-blog-automation/blob/main/README.md)를 참고해주세요.
        files: |
          블로그자동화-Windows.zip
          블로그자동화-macOS.zip
          블로그자동화-Linux.zip
        draft: false
        prerelease: false
