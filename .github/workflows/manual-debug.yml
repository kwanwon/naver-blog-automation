name: 🔧 수동 디버깅 빌드

on:
  workflow_dispatch:  # 수동 실행만 가능
    inputs:
      platform:
        description: '빌드할 플랫폼 선택'
        required: true
        default: 'windows'
        type: choice
        options:
        - windows
        - macos
        - linux
        - all

jobs:
  debug-build:
    name: 🔍 ${{ github.event.inputs.platform }} 디버깅 빌드
    runs-on: ${{ github.event.inputs.platform == 'windows' && 'windows-latest' || github.event.inputs.platform == 'macos' && 'macos-latest' || 'ubuntu-latest' }}
    if: github.event.inputs.platform != 'all'
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📋 환경 정보 출력
      run: |
        echo "=== 운영체제 정보 ==="
        ${{ github.event.inputs.platform == 'windows' && 'systeminfo | findstr /B /C:"OS Name" /C:"OS Version"' || 'uname -a' }}
        echo ""
        echo "=== Python 정보 ==="
        python --version
        pip --version
        echo ""
        echo "=== 현재 디렉토리 ==="
        ${{ github.event.inputs.platform == 'windows' && 'dir' || 'ls -la' }}
        
    - name: 📦 의존성 설치
      run: |
        echo "=== pip 업그레이드 ==="
        python -m pip install --upgrade pip
        echo ""
        echo "=== requirements.txt 확인 ==="
        ${{ github.event.inputs.platform == 'windows' && 'type requirements.txt' || 'cat requirements.txt' }}
        echo ""
        echo "=== 의존성 설치 ==="
        pip install -r requirements.txt
        echo ""
        echo "=== PyInstaller 설치 ==="
        pip install pyinstaller
        echo ""
        echo "=== 설치된 패키지 확인 ==="
        pip list | grep -E "(pyinstaller|flet|openai)"
        
    - name: 📁 필수 파일 확인
      run: |
        echo "=== 필수 파일 존재 여부 ==="
        ${{ github.event.inputs.platform == 'windows' && 'if exist blog_writer_app.py echo "✅ blog_writer_app.py 존재" else echo "❌ blog_writer_app.py 없음"' || 'test -f blog_writer_app.py && echo "✅ blog_writer_app.py 존재" || echo "❌ blog_writer_app.py 없음"' }}
        ${{ github.event.inputs.platform == 'windows' && 'if exist version.json echo "✅ version.json 존재" else echo "❌ version.json 없음"' || 'test -f version.json && echo "✅ version.json 존재" || echo "❌ version.json 없음"' }}
        ${{ github.event.inputs.platform == 'windows' && 'if exist config echo "✅ config 디렉토리 존재" else echo "❌ config 디렉토리 없음"' || 'test -d config && echo "✅ config 디렉토리 존재" || echo "❌ config 디렉토리 없음"' }}
        ${{ github.event.inputs.platform == 'windows' && 'if exist modules echo "✅ modules 디렉토리 존재" else echo "❌ modules 디렉토리 없음"' || 'test -d modules && echo "✅ modules 디렉토리 존재" || echo "❌ modules 디렉토리 없음"' }}
        echo ""
        echo "=== 이미지 디렉토리 확인 ==="
        ${{ github.event.inputs.platform == 'windows' && 'for /d %i in (default_images*) do echo "✅ %i 존재"' || 'for dir in default_images*; do test -d "$dir" && echo "✅ $dir 존재" || echo "❌ $dir 없음"; done' }}
        
    - name: 🔨 PyInstaller 테스트 빌드
      run: |
        echo "=== PyInstaller 버전 확인 ==="
        pyinstaller --version
        echo ""
        echo "=== 기본 빌드 시도 ==="
        pyinstaller --onedir --name="블로그자동화-테스트" blog_writer_app.py
        echo ""
        echo "=== 빌드 결과 확인 ==="
        ${{ github.event.inputs.platform == 'windows' && 'if exist dist echo "✅ dist 디렉토리 생성됨" && dir dist' || 'test -d dist && echo "✅ dist 디렉토리 생성됨" && ls -la dist/' }}
        
    - name: 📤 디버깅 결과 업로드
      uses: actions/upload-artifact@v3
      with:
        name: debug-${{ github.event.inputs.platform }}-${{ github.run_number }}
        path: |
          dist/
          build/
          *.spec
        retention-days: 7
        
  all-platforms:
    name: 🌍 모든 플랫폼 빌드
    if: github.event.inputs.platform == 'all'
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest  
            name: macOS
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 🔨 ${{ matrix.name }} 빌드
      run: |
        echo "=== ${{ matrix.name }} 빌드 시작 ==="
        pyinstaller --onedir --name="블로그자동화" blog_writer_app.py
        
    - name: 📤 ${{ matrix.name }} 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-${{ matrix.name }}
        path: dist/
        retention-days: 7
