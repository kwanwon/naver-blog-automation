name: Build and Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0 같은 태그 푸시 시 빌드
  workflow_dispatch:  # 수동 실행 가능

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install flet
          pip install selenium webdriver-manager
          pip install Pillow requests tkcalendar
          pip install openai google-generativeai
          pip install psutil cryptography
          pip install pyperclip
          
      - name: Build Windows executable
        run: |
          pyinstaller --onedir --windowed --name "BlogAutomation_Windows" ^
            --add-data "modules;modules" ^
            --add-data "config;config" ^
            --hidden-import=flet ^
            --hidden-import=flet.core ^
            --hidden-import=PIL ^
            --hidden-import=PIL.Image ^
            --hidden-import=requests ^
            --hidden-import=selenium ^
            --hidden-import=webdriver_manager ^
            --hidden-import=tkcalendar ^
            --hidden-import=openai ^
            --hidden-import=google.generativeai ^
            --collect-all flet ^
            --collect-all tkcalendar ^
            blog_writer_app.py
        shell: cmd
          
      - name: Create Windows ZIP
        run: |
          cd dist
          Compress-Archive -Path "BlogAutomation_Windows" -DestinationPath "BlogAutomation-Windows.zip"
        shell: powershell
          
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogAutomation-Windows
          path: dist/BlogAutomation-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install flet
          pip install selenium webdriver-manager
          pip install Pillow requests tkcalendar
          pip install openai google-generativeai
          pip install psutil cryptography
          pip install pyperclip
          
      - name: Build macOS app
        run: |
          pyinstaller --onedir --windowed --name "BlogAutomation_Mac" \
            --add-data "modules:modules" \
            --add-data "config:config" \
            --hidden-import=flet \
            --hidden-import=flet.core \
            --hidden-import=PIL \
            --hidden-import=PIL.Image \
            --hidden-import=requests \
            --hidden-import=selenium \
            --hidden-import=webdriver_manager \
            --hidden-import=tkcalendar \
            --hidden-import=openai \
            --hidden-import=google.generativeai \
            --collect-all flet \
            --collect-all tkcalendar \
            blog_writer_app.py
          
      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r "BlogAutomation-Mac.zip" "BlogAutomation_Mac.app" || zip -r "BlogAutomation-Mac.zip" "BlogAutomation_Mac"
          
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogAutomation-Mac
          path: dist/BlogAutomation-Mac.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogAutomation-Windows
          path: ./release-files/
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogAutomation-Mac
          path: ./release-files/
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "블로그자동화 ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎉 블로그자동화 ${{ steps.get_version.outputs.VERSION }} 릴리스
            
            ### 📥 다운로드
            - **Mac 사용자**: `BlogAutomation-Mac.zip` 다운로드
            - **Windows 사용자**: `BlogAutomation-Windows.zip` 다운로드
            
            ### 📌 설치 방법
            1. ZIP 파일 다운로드
            2. 압축 해제
            3. 앱 실행
            
            ---
            ⚡ 앱 내에서 자동 업데이트를 지원합니다!
          files: |
            ./release-files/BlogAutomation-Windows.zip
            ./release-files/BlogAutomation-Mac.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
