name: Build and Release

on:
  push:
    tags:
      - 'v*'  # v1.0.0 같은 태그 푸시 시 빌드
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      create_release:
        description: 'Create a release after build'
        required: false
        default: 'false'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_cross_platform.txt
          pip install pyinstaller
          
      - name: Build Windows executable
        run: |
          python build_cross_platform.py --platform windows
          
      - name: Create Windows ZIP
        run: |
          cd dist
          Compress-Archive -Path "BlogAutomation_Windows" -DestinationPath "블로그자동화-Windows.zip"
          
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: 블로그자동화-Windows
          path: dist/블로그자동화-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_cross_platform.txt
          pip install pyinstaller
          
      - name: Build macOS app
        run: |
          python build_cross_platform.py --platform macos
          
      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r "블로그자동화-Mac.zip" "BlogAutomation_Macos.app"
          
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: 블로그자동화-Mac
          path: dist/블로그자동화-Mac.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: 블로그자동화-Windows
          path: ./release-files/
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: 블로그자동화-Mac
          path: ./release-files/
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Read changelog
        id: changelog
        run: |
          if [ -f version.json ]; then
            CHANGELOG=$(python3 -c "import json; data=json.load(open('version.json')); print('\n'.join(data.get('changelog', [])))")
            echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGELOG" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "CHANGELOG=업데이트 내용이 없습니다." >> $GITHUB_OUTPUT
          fi
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "블로그자동화 ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎉 블로그자동화 ${{ steps.get_version.outputs.VERSION }} 릴리스
            
            ### 📋 변경 내용
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ### 📥 다운로드
            - **Mac 사용자**: `블로그자동화-Mac.zip` 다운로드
            - **Windows 사용자**: `블로그자동화-Windows.zip` 다운로드
            
            ### 📌 설치 방법
            1. ZIP 파일 다운로드
            2. 압축 해제
            3. 앱 실행
            
            ---
            ⚡ 앱 내에서 자동 업데이트를 지원합니다!
          files: |
            ./release-files/블로그자동화-Windows.zip
            ./release-files/블로그자동화-Mac.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
