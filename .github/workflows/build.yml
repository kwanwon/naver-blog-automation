name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 pyinstaller
          pip install selenium webdriver-manager
          pip install Pillow requests tkcalendar
          pip install openai google-generativeai
          pip install psutil cryptography
          pip install pyperclip httpx
          pip install pandas watchdog
          
      - name: Build with flet pack
        run: |
          flet pack blog_writer_app.py --name BlogAutomation_Windows --icon assets/icon.png
          
      - name: Copy additional data files
        run: |
          xcopy /E /I modules dist\BlogAutomation_Windows\modules
          xcopy /E /I config dist\BlogAutomation_Windows\config
          xcopy /E /I utils dist\BlogAutomation_Windows\utils
          xcopy /E /I assets dist\BlogAutomation_Windows\assets
          copy version.json dist\BlogAutomation_Windows\
          del /F dist\BlogAutomation_Windows\modules\.developer_mode 2>nul
        shell: cmd
      
      # Inno Setup 설치 및 인스톨러 빌드
      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: cmd
        
      - name: Create installer icon
        run: |
          if (Test-Path "assets/icon.ico") {
            Copy-Item "assets/icon.ico" "installer/icon.ico"
          } elseif (Test-Path "assets/icon.png") {
            # PNG to ICO 변환이 필요한 경우 기본 아이콘 사용
            Copy-Item "assets/icon.png" "installer/icon.ico"
          }
          New-Item -ItemType Directory -Force -Path "output"
        shell: powershell
        
      - name: Build Inno Setup installer
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\installer.iss"
        shell: cmd
          
      - name: Create Windows ZIP
        run: |
          cd dist
          Compress-Archive -Path "BlogAutomation_Windows" -DestinationPath "BlogAutomation-Windows.zip"
        shell: powershell
        
      - name: List output files
        run: |
          echo "=== dist folder ==="
          dir dist
          echo "=== output folder ==="
          dir output
        shell: cmd
          
      - name: Upload Windows ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogAutomation-Windows-ZIP
          path: dist/BlogAutomation-Windows.zip
          
      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogAutomation-Windows-Setup
          path: output/BlogAutomation_Setup_*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 pyinstaller
          pip install selenium webdriver-manager
          pip install Pillow requests tkcalendar
          pip install openai google-generativeai
          pip install psutil cryptography
          pip install pyperclip httpx
          pip install pandas watchdog
          
      - name: Build with flet pack
        run: |
          flet pack blog_writer_app.py --name BlogAutomation_Mac --icon assets/icon.png
          
      - name: Copy additional data files to app bundle
        run: |
          APP_FRAMEWORKS="dist/BlogAutomation_Mac.app/Contents/Frameworks"
          cp -R modules "$APP_FRAMEWORKS/"
          cp -R config "$APP_FRAMEWORKS/"
          cp -R utils "$APP_FRAMEWORKS/"
          cp -R assets "$APP_FRAMEWORKS/"
          cp version.json "$APP_FRAMEWORKS/"
          # 개발자 모드 파일 삭제 (일반 사용자는 시리얼 인증 필요)
          rm -f "$APP_FRAMEWORKS/modules/.developer_mode"
          
      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r "BlogAutomation-Mac.zip" "BlogAutomation_Mac.app"
          
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogAutomation-Mac
          path: dist/BlogAutomation-Mac.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Download Windows ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogAutomation-Windows-ZIP
          path: ./release-files/
          
      - name: Download Windows Installer artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogAutomation-Windows-Setup
          path: ./release-files/
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogAutomation-Mac
          path: ./release-files/
      
      - name: List release files
        run: ls -la ./release-files/
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "블로그자동화 ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎉 블로그자동화 ${{ steps.get_version.outputs.VERSION }} 릴리스
            
            ### 📥 다운로드
            
            #### 🪟 Windows 사용자
            - **설치 프로그램 (권장)**: `BlogAutomation_Setup_${{ steps.get_version.outputs.VERSION }}.exe`
              - 더블클릭으로 간편 설치
              - 바탕화면 바로가기 생성
              - 시작 메뉴 등록
            - **ZIP 파일**: `BlogAutomation-Windows.zip`
              - 압축 해제 후 바로 사용
            
            #### 🍎 Mac 사용자
            - **ZIP 파일**: `BlogAutomation-Mac.zip`
              - 압축 해제 후 앱 실행
              - 첫 실행 시 우클릭 → "열기" 선택
            
            ### 📌 설치 후 필요사항
            - Chrome 브라우저 설치
            - 시리얼 번호 입력
            
            ### 📋 변경사항
            변경사항은 version.json 파일을 참조해주세요.
          files: |
            ./release-files/BlogAutomation-Windows.zip
            ./release-files/BlogAutomation_Setup_*.exe
            ./release-files/BlogAutomation-Mac.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
