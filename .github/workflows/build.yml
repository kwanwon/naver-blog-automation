name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet==0.28.3 pyinstaller
          pip install selenium webdriver-manager
          pip install Pillow requests tkcalendar
          pip install openai google-generativeai
          pip install psutil cryptography
          pip install pyperclip httpx
          pip install pandas watchdog
          
      - name: Build with flet pack
        run: |
          flet pack blog_writer_app.py --name BlogAutomation_Mac --icon assets/icon.png --add-data "manual_session_helper.py:." --add-data "setup_chrome_permissions.py:."
          
      - name: Copy additional data files to app bundle
        run: |
          APP_FRAMEWORKS="dist/BlogAutomation_Mac.app/Contents/Frameworks"
          cp -R modules "$APP_FRAMEWORKS/"
          cp -R config "$APP_FRAMEWORKS/"
          cp -R utils "$APP_FRAMEWORKS/"
          cp -R assets "$APP_FRAMEWORKS/"
          cp version.json "$APP_FRAMEWORKS/"
          # 핵심 자동화 모듈 명시적 복사 (빌드 vs 개발 모드 동일 동작 보장)
          cp naver_cafe_auto.py "$APP_FRAMEWORKS/"
          cp naver_band_auto.py "$APP_FRAMEWORKS/"
          cp naver_blog_auto.py "$APP_FRAMEWORKS/"
          cp naver_blog_auto_image.py "$APP_FRAMEWORKS/"
          cp naver_blog_post_finisher.py "$APP_FRAMEWORKS/"
          # 개발자 모드 파일 삭제 (일반 사용자는 시리얼 인증 필요)
          # rm -f "$APP_FRAMEWORKS/modules/.developer_mode"
          
      - name: Create macOS ZIP
        run: |
          cd dist
          zip -r "BlogAutomation-Mac.zip" "BlogAutomation_Mac.app"
          
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlogAutomation-Mac
          path: dist/BlogAutomation-Mac.zip

  create-release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
          
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: BlogAutomation-Mac
          path: ./release-files/
      
      - name: List release files
        run: ls -la ./release-files/
      
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "블로그자동화 ${{ steps.get_version.outputs.VERSION }}"
          body: |
            ## 🎉 블로그자동화 ${{ steps.get_version.outputs.VERSION }} 릴리스
            
            ### 📥 다운로드
            
            #### 🪟 Windows 사용자
            - **설치 프로그램 (권장)**: `BlogAutomation_Setup_*.exe` (작성자가 수동 업로드)
            - **ZIP 파일**: `BlogAutomation-Windows.zip` (작성자가 수동 업로드)
            
            #### 🍎 Mac 사용자
            - **ZIP 파일**: `BlogAutomation-Mac.zip`
              - 압축 해제 후 앱 실행
              - 첫 실행 시 우클릭 → "열기" 선택
            
            ### 📌 설치 후 필요사항
            - Chrome 브라우저 설치
            - 시리얼 번호 입력
            
            ### 📋 변경사항
            변경사항은 version.json 파일을 참조해주세요.
          files: |
            ./release-files/BlogAutomation-Mac.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
