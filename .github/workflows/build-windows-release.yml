name: 🪟 Windows 배포 빌드

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:  # 수동 실행 가능
    inputs:
      version:
        description: '배포 버전 (예: 1.2.3)'
        required: false
        type: string

jobs:
  build-windows-release:
    name: 🪟 Windows 배포 빌드
    runs-on: windows-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        pip install requests  # ChromeManager를 위한 명시적 설치
        pip install Pillow   # PIL (Pillow) 명시적 설치
        pip install selenium # selenium 명시적 설치
        pip install openai   # openai 명시적 설치
        
    - name: 📄 버전 정보 확인
      id: version_info
      run: |
        if (Test-Path "version.json") {
          $version = (Get-Content version.json | ConvertFrom-Json).version
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "배포 버전: $version"
        } else {
          echo "version=1.0.0" >> $env:GITHUB_OUTPUT
          echo "기본 버전: 1.0.0"
        }
      shell: pwsh
      
    - name: 🖼️ 배포용 이미지 폴더 준비 (빈 폴더)
      run: |
        # 기존 이미지 폴더 백업
        if (Test-Path "default_images_backup") { Remove-Item -Recurse -Force "default_images_backup" }
        New-Item -ItemType Directory -Force -Path "default_images_backup" | Out-Null
        
        # 이미지 폴더들을 빈 폴더로 교체
        for ($i=1; $i -le 10; $i++) {
          $folderName = "default_images_$i"
          if (Test-Path $folderName) {
            Move-Item $folderName "default_images_backup/$folderName" -Force
          }
          New-Item -ItemType Directory -Force -Path $folderName | Out-Null
          Write-Host "✅ 빈 이미지 폴더 생성: $folderName"
        }
        
        # default_images 폴더도 빈 폴더로
        if (Test-Path "default_images") {
          Move-Item "default_images" "default_images_backup/default_images" -Force
        }
        New-Item -ItemType Directory -Force -Path "default_images" | Out-Null
        Write-Host "✅ 배포용 빈 이미지 폴더 준비 완료"
      shell: pwsh
        
    - name: 🔑 배포용 API 키 설정
      env:
        DISTRIBUTION_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # 배포용 gpt_settings.txt 파일에 API 키 설정
        if ($env:DISTRIBUTION_API_KEY) {
          echo "📦 배포용 API 키 설정 중..."
          
          # 기존 설정 파일 백업 (있다면)
          if (Test-Path "config/gpt_settings.txt") {
            Copy-Item "config/gpt_settings.txt" "config/gpt_settings_dev_backup.txt" -Force
          }
          
          # 배포용 설정 파일 생성 (API 키 포함)
          $settings = @{
            "api_key" = $env:DISTRIBUTION_API_KEY
            "persona" = "•건강, 성장, 교육에 관심 많은 대상으로 친근하게 조언하는 전문가`n`t•실전 경험과 전문 지식을 보유"
            "instructions" = " •글자 수: 1500자 이상 ~ 1600자 이내`n`t•구성: 도입 – 본문 – 결론`n`t•도입: 남들이 궁금해 할만한 주제와 공감유도`n`t•본문: 실용적인 정보와 조언, 인기 키워드 포함하기`n`t•결론: 전체적인 간단한 요약`n`t•SEO 최적화: 핵심 키워드를 자연스럽게 본문에 포함`n`t•사용 금지 합기도, 태권도,등의 특정 종목 `n`t•특수문자, 기호, 이모티콘, 글 앞에 숫자(1. 2. 등) 사용 금지`n`t• 글 앞에 ""첫째, 둘째, 셋째…"" 등 숫자 대신 한글로만 표기 "
            "style" = "`t•말투: 친근하고 따뜻한 부드러운 존댓말 사용 (예: ~이에요, ~해요, ~지요 등)`n`t•호칭: ""어머니"", ""아버님"", ""학부모님"" 등은 사용하지 않음. `n`t•문단 구성: 한 문단은 3~4줄 이내로 작성하여 가독성 강화`n`t•전문용어는 최대한 쉽게 풀어 설명`n`t•독자의 참여를 유도하기 위해 질문형 문장을 적절히 사용`n`t•공감대 형성을 위해 경험, 사례, 감정이 느껴지는 표현 포함`n`t•긍정적이고 희망적인 메시지로 마무리`n`t•실생활에서 바로 활용 가능한 조언 중심"
            "last_updated" = (Get-Date -Format "yyyy-MM-dd HH:mm:ss")
          }
          
          $settings | ConvertTo-Json -Depth 10 | Out-File -FilePath "config/gpt_settings.txt" -Encoding UTF8
          echo "✅ 배포용 API 키 설정 완료"
        } else {
          echo "⚠️ API 키가 설정되지 않았습니다"
        }
      shell: pwsh
      
    - name: 🔨 Windows 배포 빌드
      run: |
        # Windows 배포용 빌드 (사용자용)
        echo "📦 배포 빌드 시작"
        pyinstaller --clean --noconfirm `
          --onedir `
          --windowed `
          --name="블로그자동화" `
          --add-data "config;config" `
          --add-data "modules;modules" `
          --add-data "default_images;default_images" `
          --add-data "default_images_1;default_images_1" `
          --add-data "default_images_2;default_images_2" `
          --add-data "default_images_3;default_images_3" `
          --add-data "default_images_4;default_images_4" `
          --add-data "default_images_5;default_images_5" `
          --add-data "default_images_6;default_images_6" `
          --add-data "default_images_7;default_images_7" `
          --add-data "default_images_8;default_images_8" `
          --add-data "default_images_9;default_images_9" `
          --add-data "default_images_10;default_images_10" `
          --add-data "requirements.txt;." `
          --add-data "version.json;." `
          --hidden-import=PIL `
          --hidden-import=selenium `
          --hidden-import=openai `
          --hidden-import=openai._client `
          --hidden-import=openai.resources `
          --hidden-import=openai.resources.chat `
          --hidden-import=openai.resources.chat.completions `
          --hidden-import=requests `
          --hidden-import=flet `
          --collect-all=openai `
          --collect-all=flet `
          blog_writer_app.py
      shell: pwsh
          
    - name: 🔄 파일 복원
      run: |
        Write-Host "🔄 빌드 후 파일 복원 중..."
        
        # 설정 파일 복원 (개발자용)
        if (Test-Path "config/gpt_settings_dev_backup.txt") {
          Move-Item "config/gpt_settings_dev_backup.txt" "config/gpt_settings.txt" -Force
          Write-Host "✅ 개발자 설정 파일 복원 완료"
        }
        
        # 이미지 폴더 복원
        if (Test-Path "default_images_backup") {
          # 빈 폴더 삭제
          if (Test-Path "default_images") { Remove-Item -Recurse -Force "default_images" }
          for ($i=1; $i -le 10; $i++) {
            $folderName = "default_images_$i"
            if (Test-Path $folderName) { Remove-Item -Recurse -Force $folderName }
          }
          
          # 백업된 원본 복원
          Move-Item "default_images_backup/*" . -Force
          Remove-Item -Recurse -Force "default_images_backup"
          Write-Host "✅ 이미지 폴더 복원 완료"
        }
      shell: pwsh
      
    - name: 📝 배포 정보 파일 생성
      run: |
        $deployInfo = @"
        🎉 블로그 자동화 프로그램 - Windows 배포판
        ==========================================
        
        📦 버전: ${{ steps.version_info.outputs.version }}
        📅 빌드 날짜: $(Get-Date -Format "yyyy-MM-dd HH:mm:ss")
        💻 플랫폼: Windows x64
        
        ⚙️ 시작하기:
        1. '블로그자동화.exe' 파일을 실행하세요
        2. 시리얼 번호를 입력하여 인증받으세요
        3. GPT 설정에서 원하는 글쓰기 스타일과 지침을 설정하세요
        4. default_images 폴더에 원하는 이미지를 추가하세요
        5. 네이버 블로그 자동화를 시작하세요!
        
        📂 폴더 구조:
        - default_images/: 블로그 포스팅에 사용할 이미지를 넣으세요
        - default_images_1 ~ 10/: 추가 이미지 폴더 (선택사항)
        - config/: 설정 파일이 자동으로 저장됩니다
        
        🔧 사용자 설정:
        - GPT 설정(지침, 스타일)은 프로그램 내에서 커스터마이징 가능
        - 모든 설정은 자동으로 사용자 디바이스에 저장됩니다
        
        ⚠️ 문제 해결:
        - Windows Defender 경고: '자세한 정보' > '실행' 클릭
        - 실행되지 않을 경우: 관리자 권한으로 실행
        - 시리얼 인증 문제: 개발자에게 문의하세요
        
        📧 지원: https://github.com/yourusername/blog-automation/issues
        "@
        
        $deployInfo | Out-File -FilePath "dist/블로그자동화/배포_정보.txt" -Encoding UTF8
        Write-Host "✅ 배포 정보 파일 생성 완료"
      shell: pwsh
      
    - name: 📁 빌드 결과 확인
      run: |
        Write-Host "빌드 디렉토리 내용:"
        Get-ChildItem -Path "dist/블로그자동화" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
        
        Write-Host "`n빌드 크기:"
        $size = (Get-ChildItem -Path "dist/블로그자동화" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
        Write-Host "$([math]::Round($size, 2)) MB"
      shell: pwsh
      
    - name: 📦 배포 패키지 압축
      run: |
        Compress-Archive -Path "dist/블로그자동화/*" -DestinationPath "블로그자동화-Windows-v${{ steps.version_info.outputs.version }}.zip" -Force
        
        # 압축 파일 정보
        $zipFile = Get-Item "블로그자동화-Windows-v${{ steps.version_info.outputs.version }}.zip"
        Write-Host "압축 파일 생성 완료: $($zipFile.Name)"
        Write-Host "파일 크기: $([math]::Round($zipFile.Length / 1MB, 2)) MB"
      shell: pwsh
      
    - name: 📤 Windows 배포 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Windows-Release
        path: 블로그자동화-Windows-v${{ steps.version_info.outputs.version }}.zip
        retention-days: 90
        
    - name: 🎉 릴리스 생성 (태그가 있을 경우)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: 블로그자동화-Windows-v${{ steps.version_info.outputs.version }}.zip
        body: |
          ## 🎉 블로그 자동화 Windows 배포판
          
          ### 📦 버전 정보
          - **버전**: v${{ steps.version_info.outputs.version }}
          - **플랫폼**: Windows x64
          - **빌드 날짜**: ${{ github.event.head_commit.timestamp }}
          
          ### 🚀 새로운 기능
          - OpenAI GPT API 연동
          - 네이버 블로그 자동 포스팅
          - 이미지 자동 업로드 및 최적화
          - 시리얼 인증 시스템
          - 자동 업데이트 기능
          
          ### 💾 다운로드 및 설치
          1. `블로그자동화-Windows-v${{ steps.version_info.outputs.version }}.zip` 다운로드
          2. 압축 해제
          3. `블로그자동화.exe` 실행
          
          ### ⚠️ 주의사항
          - Windows 10 이상 필요
          - 최초 실행 시 Windows Defender 경고가 나타날 수 있습니다
          - OpenAI API 키가 필요합니다
          
          ### 🔧 시스템 요구사항
          - OS: Windows 10/11 (64-bit)
          - RAM: 최소 4GB (권장 8GB)
          - 디스크 공간: 500MB 이상
          - 인터넷 연결 필수
          
          ### 📞 지원
          - 버그 리포트: [Issues](https://github.com/${{ github.repository }}/issues)
          - 문의: [Discussions](https://github.com/${{ github.repository }}/discussions)
          
          ---
          **🤖 GitHub Actions로 자동 빌드됨**
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 📊 빌드 요약
      run: |
        echo "# 🎉 Windows 배포 빌드 완료!" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "## 📦 빌드 정보" >> $env:GITHUB_STEP_SUMMARY
        echo "- **버전**: v${{ steps.version_info.outputs.version }}" >> $env:GITHUB_STEP_SUMMARY
        echo "- **플랫폼**: Windows x64" >> $env:GITHUB_STEP_SUMMARY
        echo "- **빌드 날짜**: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')" >> $env:GITHUB_STEP_SUMMARY
        echo "- **커밋**: ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "## 📥 다운로드" >> $env:GITHUB_STEP_SUMMARY
        echo "아티팩트에서 `블로그자동화-Windows-Release`를 다운로드하세요" >> $env:GITHUB_STEP_SUMMARY
        echo "" >> $env:GITHUB_STEP_SUMMARY
        echo "## ✅ 배포 준비 완료" >> $env:GITHUB_STEP_SUMMARY
        echo "사용자들에게 배포할 수 있습니다! 🚀" >> $env:GITHUB_STEP_SUMMARY
      shell: pwsh

  # 배포 알림 (선택사항)
  notify-deployment:
    name: 📢 배포 알림
    needs: build-windows-release
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: 🔔 배포 완료 알림
      run: |
        echo "✅ Windows 배포 빌드가 성공적으로 완료되었습니다!"
        echo "📦 아티팩트를 다운로드하여 사용자들에게 배포하세요"
        echo "🌐 릴리스 페이지: https://github.com/${{ github.repository }}/releases"

