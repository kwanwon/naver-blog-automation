name: 🚀 수정된 크로스 플랫폼 빌드

on:
  workflow_dispatch:  # 수동 실행으로 테스트
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/debug-*.yml'

jobs:
  build-windows:
    name: 🪟 Windows 빌드
    runs-on: windows-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 📋 빌드 전 확인
      run: |
        echo "=== 파일 구조 확인 ==="
        dir
        echo "=== Python 버전 ==="
        python --version
        echo "=== PyInstaller 버전 ==="
        pyinstaller --version
        
    - name: 🔨 Windows 빌드 (단계별)
      run: |
        echo "=== 1단계: 기본 빌드 ==="
        pyinstaller --onedir --windowed --name="블로그자동화" blog_writer_app.py
        
        echo "=== 2단계: 필수 파일 복사 ==="
        if exist "dist\블로그자동화\" (
          xcopy /E /I /Y config "dist\블로그자동화\config\"
          xcopy /E /I /Y modules "dist\블로그자동화\modules\"
          copy /Y version.json "dist\블로그자동화\"
          copy /Y requirements.txt "dist\블로그자동화\"
          
          echo "=== 3단계: 이미지 폴더 복사 ==="
          xcopy /E /I /Y default_images "dist\블로그자동화\default_images\"
          xcopy /E /I /Y default_images_1 "dist\블로그자동화\default_images_1\"
          xcopy /E /I /Y default_images_2 "dist\블로그자동화\default_images_2\"
          xcopy /E /I /Y default_images_3 "dist\블로그자동화\default_images_3\"
          xcopy /E /I /Y default_images_4 "dist\블로그자동화\default_images_4\"
          xcopy /E /I /Y default_images_5 "dist\블로그자동화\default_images_5\"
          xcopy /E /I /Y default_images_6 "dist\블로그자동화\default_images_6\"
          xcopy /E /I /Y default_images_7 "dist\블로그자동화\default_images_7\"
          xcopy /E /I /Y default_images_8 "dist\블로그자동화\default_images_8\"
          xcopy /E /I /Y default_images_9 "dist\블로그자동화\default_images_9\"
          xcopy /E /I /Y default_images_10 "dist\블로그자동화\default_images_10\"
          
          echo "=== 빌드 완료 ==="
          dir "dist\블로그자동화"
        ) else (
          echo "❌ 빌드 실패: dist 디렉토리가 생성되지 않음"
          exit 1
        )
          
    - name: 📤 Windows 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Windows
        path: dist/블로그자동화/
        retention-days: 30

  build-macos:
    name: 🍎 macOS 빌드
    runs-on: macos-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 📋 빌드 전 확인
      run: |
        echo "=== 파일 구조 확인 ==="
        ls -la
        echo "=== Python 버전 ==="
        python --version
        echo "=== PyInstaller 버전 ==="
        pyinstaller --version
        
    - name: 🔨 macOS 빌드 (단계별)
      run: |
        echo "=== 1단계: 기본 빌드 ==="
        pyinstaller --onedir --windowed --name="블로그자동화" blog_writer_app.py
        
        echo "=== 2단계: 필수 파일 복사 ==="
        if [ -d "dist/블로그자동화.app" ]; then
          cp -R config "dist/블로그자동화.app/Contents/MacOS/"
          cp -R modules "dist/블로그자동화.app/Contents/MacOS/"
          cp version.json "dist/블로그자동화.app/Contents/MacOS/"
          cp requirements.txt "dist/블로그자동화.app/Contents/MacOS/"
          
          echo "=== 3단계: 이미지 폴더 복사 ==="
          cp -R default_images "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_1 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_2 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_3 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_4 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_5 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_6 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_7 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_8 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_9 "dist/블로그자동화.app/Contents/MacOS/"
          cp -R default_images_10 "dist/블로그자동화.app/Contents/MacOS/"
          
          echo "=== 빌드 완료 ==="
          ls -la "dist/블로그자동화.app/Contents/MacOS/"
        else
          echo "❌ 빌드 실패: .app 파일이 생성되지 않음"
          exit 1
        fi
          
    - name: 📤 macOS 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-macOS
        path: dist/블로그자동화.app/
        retention-days: 30

  build-linux:
    name: 🐧 Linux 빌드
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 📋 빌드 전 확인
      run: |
        echo "=== 파일 구조 확인 ==="
        ls -la
        echo "=== Python 버전 ==="
        python --version
        echo "=== PyInstaller 버전 ==="
        pyinstaller --version
        
    - name: 🔨 Linux 빌드 (단계별)
      run: |
        echo "=== 1단계: 기본 빌드 ==="
        pyinstaller --onedir --name="블로그자동화" blog_writer_app.py
        
        echo "=== 2단계: 필수 파일 복사 ==="
        if [ -d "dist/블로그자동화" ]; then
          cp -R config "dist/블로그자동화/"
          cp -R modules "dist/블로그자동화/"
          cp version.json "dist/블로그자동화/"
          cp requirements.txt "dist/블로그자동화/"
          
          echo "=== 3단계: 이미지 폴더 복사 ==="
          cp -R default_images "dist/블로그자동화/"
          cp -R default_images_1 "dist/블로그자동화/"
          cp -R default_images_2 "dist/블로그자동화/"
          cp -R default_images_3 "dist/블로그자동화/"
          cp -R default_images_4 "dist/블로그자동화/"
          cp -R default_images_5 "dist/블로그자동화/"
          cp -R default_images_6 "dist/블로그자동화/"
          cp -R default_images_7 "dist/블로그자동화/"
          cp -R default_images_8 "dist/블로그자동화/"
          cp -R default_images_9 "dist/블로그자동화/"
          cp -R default_images_10 "dist/블로그자동화/"
          
          echo "=== 빌드 완료 ==="
          ls -la "dist/블로그자동화/"
        else
          echo "❌ 빌드 실패: dist 디렉토리가 생성되지 않음"
          exit 1
        fi
          
    - name: 📤 Linux 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Linux
        path: dist/블로그자동화/
        retention-days: 30
