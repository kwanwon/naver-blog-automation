name: 🚀 최종 완성 크로스 플랫폼 빌드

on:
  workflow_dispatch:  # 수동 실행
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/workflows/test-*.yml'
      - '.github/workflows/debug-*.yml'
      - '.github/workflows/manual-*.yml'

jobs:
  build-windows:
    name: 🪟 Windows 빌드
    runs-on: windows-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 📋 빌드 전 확인
      run: |
        echo "=== 파일 확인 ==="
        if exist blog_writer_app.py (echo "✅ blog_writer_app.py") else (echo "❌ blog_writer_app.py 없음" && exit 1)
        if exist config (echo "✅ config 디렉토리") else (echo "❌ config 없음" && exit 1)
        if exist modules (echo "✅ modules 디렉토리") else (echo "❌ modules 없음" && exit 1)
        
    - name: 🔨 Windows PyInstaller 빌드
      run: |
        echo "=== PyInstaller 실행 ==="
        pyinstaller --onedir --windowed --name="블로그자동화" ^
          --hidden-import=flet ^
          --hidden-import=openai ^
          --hidden-import=selenium ^
          --hidden-import=PIL ^
          --collect-all=flet ^
          blog_writer_app.py
          
    - name: 📁 필수 파일 복사
      run: |
        echo "=== 파일 복사 시작 ==="
        if exist "dist\블로그자동화" (
          xcopy /E /I /Y config "dist\블로그자동화\config\"
          xcopy /E /I /Y modules "dist\블로그자동화\modules\"
          copy /Y version.json "dist\블로그자동화\"
          copy /Y requirements.txt "dist\블로그자동화\"
          
          for /d %%i in (default_images*) do (
            xcopy /E /I /Y "%%i" "dist\블로그자동화\%%i\"
          )
          
          echo "=== 빌드 완료 확인 ==="
          dir "dist\블로그자동화"
        ) else (
          echo "❌ PyInstaller 빌드 실패"
          exit 1
        )
          
    - name: 📤 Windows 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Windows
        path: dist/블로그자동화/
        retention-days: 30

  build-macos:
    name: 🍎 macOS 빌드
    runs-on: macos-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 📋 빌드 전 확인
      run: |
        echo "=== 파일 확인 ==="
        test -f blog_writer_app.py && echo "✅ blog_writer_app.py" || (echo "❌ blog_writer_app.py 없음" && exit 1)
        test -d config && echo "✅ config 디렉토리" || (echo "❌ config 없음" && exit 1)
        test -d modules && echo "✅ modules 디렉토리" || (echo "❌ modules 없음" && exit 1)
        
    - name: 🔨 macOS PyInstaller 빌드
      run: |
        echo "=== PyInstaller 실행 ==="
        pyinstaller --onedir --windowed --name="블로그자동화" \
          --hidden-import=flet \
          --hidden-import=openai \
          --hidden-import=selenium \
          --hidden-import=PIL \
          --collect-all=flet \
          blog_writer_app.py
          
    - name: 📁 필수 파일 복사
      run: |
        echo "=== 파일 복사 시작 ==="
        if [ -d "dist/블로그자동화.app" ]; then
          cp -R config "dist/블로그자동화.app/Contents/MacOS/"
          cp -R modules "dist/블로그자동화.app/Contents/MacOS/"
          cp version.json "dist/블로그자동화.app/Contents/MacOS/"
          cp requirements.txt "dist/블로그자동화.app/Contents/MacOS/"
          
          for dir in default_images*; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "dist/블로그자동화.app/Contents/MacOS/"
            fi
          done
          
          echo "=== 빌드 완료 확인 ==="
          ls -la "dist/블로그자동화.app/Contents/MacOS/"
        else
          echo "❌ PyInstaller 빌드 실패"
          exit 1
        fi
          
    - name: 📤 macOS 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-macOS
        path: dist/블로그자동화.app/
        retention-days: 30

  build-linux:
    name: 🐧 Linux 빌드
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 📋 빌드 전 확인
      run: |
        echo "=== 파일 확인 ==="
        test -f blog_writer_app.py && echo "✅ blog_writer_app.py" || (echo "❌ blog_writer_app.py 없음" && exit 1)
        test -d config && echo "✅ config 디렉토리" || (echo "❌ config 없음" && exit 1)
        test -d modules && echo "✅ modules 디렉토리" || (echo "❌ modules 없음" && exit 1)
        
    - name: 🔨 Linux PyInstaller 빌드
      run: |
        echo "=== PyInstaller 실행 ==="
        pyinstaller --onedir --name="블로그자동화" \
          --hidden-import=flet \
          --hidden-import=openai \
          --hidden-import=selenium \
          --hidden-import=PIL \
          --collect-all=flet \
          blog_writer_app.py
          
    - name: 📁 필수 파일 복사
      run: |
        echo "=== 파일 복사 시작 ==="
        if [ -d "dist/블로그자동화" ]; then
          cp -R config "dist/블로그자동화/"
          cp -R modules "dist/블로그자동화/"
          cp version.json "dist/블로그자동화/"
          cp requirements.txt "dist/블로그자동화/"
          
          for dir in default_images*; do
            if [ -d "$dir" ]; then
              cp -R "$dir" "dist/블로그자동화/"
            fi
          done
          
          echo "=== 빌드 완료 확인 ==="
          ls -la "dist/블로그자동화/"
        else
          echo "❌ PyInstaller 빌드 실패"
          exit 1
        fi
          
    - name: 📤 Linux 빌드 업로드
      uses: actions/upload-artifact@v3
      with:
        name: 블로그자동화-Linux
        path: dist/블로그자동화/
        retention-days: 30

  create-release:
    name: 🚀 릴리즈 생성
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 📋 버전 정보 읽기
      id: version
      run: |
        VERSION=$(cat version.json | grep -o '"version": "[^"]*' | grep -o '[^"]*$')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION-$(date +%Y%m%d-%H%M)" >> $GITHUB_OUTPUT
        
    - name: 📦 모든 아티팩트 다운로드
      uses: actions/download-artifact@v3
      with:
        path: ./artifacts/
        
    - name: 🗜️ 압축 파일 생성
      run: |
        cd artifacts
        zip -r ../블로그자동화-Windows.zip 블로그자동화-Windows/
        zip -r ../블로그자동화-macOS.zip 블로그자동화-macOS/
        zip -r ../블로그자동화-Linux.zip 블로그자동화-Linux/
        
    - name: 🏷️ 릴리즈 생성
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: 🎉 블로그자동화 ${{ steps.version.outputs.version }} - 크로스 플랫폼
        body: |
          ## 🎉 블로그자동화 크로스 플랫폼 빌드 성공!
          
          ### 📥 다운로드
          - **🪟 Windows**: 블로그자동화-Windows.zip
          - **🍎 macOS**: 블로그자동화-macOS.zip  
          - **🐧 Linux**: 블로그자동화-Linux.zip
          
          ### 🚀 주요 기능
          - ✅ GPT를 활용한 블로그 콘텐츠 자동 생성
          - ✅ 네이버 블로그 자동 포스팅
          - ✅ 이미지 자동 삽입 및 관리
          - ✅ 완전한 크로스 플랫폼 지원
          - ✅ 자동 업데이트 시스템
          
          ### 💻 설치 방법
          1. 해당 OS용 zip 파일을 다운로드하세요
          2. 압축을 해제하고 실행 파일을 실행하세요
          3. 첫 실행 시 GPT API 키를 설정하세요
          
          ### 🔧 빌드 정보
          - 빌드 시간: ${{ github.event.head_commit.timestamp }}
          - 커밋: ${{ github.sha }}
          - GitHub Actions로 자동 빌드됨
          
          자세한 사용법은 [README](https://github.com/kwanwon/naver-blog-automation/blob/main/README.md)를 참고해주세요.
        files: |
          블로그자동화-Windows.zip
          블로그자동화-macOS.zip
          블로그자동화-Linux.zip
        draft: false
        prerelease: false
