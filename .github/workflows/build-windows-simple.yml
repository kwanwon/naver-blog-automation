name: 🪟 간단한 Windows 빌드

on:
  workflow_dispatch:  # 수동 실행만
  push:
    branches: [ main ]

jobs:
  build-simple:
    name: 🪟 간단한 Windows 빌드
    runs-on: windows-latest
    
    steps:
    - name: 📥 코드 체크아웃
      uses: actions/checkout@v4
      
    - name: 🐍 Python 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: 📦 기본 의존성 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        
    - name: 🔨 간단한 빌드 테스트
      run: |
        echo "빌드 시작"
        pyinstaller --onefile --windowed --name="블로그자동화-테스트" blog_writer_app.py
        echo "빌드 완료"
        
    - name: 📁 결과 확인
      run: |
        dir dist
        echo "빌드 결과 확인 완료"
